<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Mapbox Demo</title>
<link rel="stylesheet" href="colors_and_type.css" />
<link href="https://api.mapbox.com/mapbox-gl-js/v3.9.0/mapbox-gl.css" rel="stylesheet" />
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #15171a; }
  body { font-family: var(--font-sans); -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
  #root { height: 100%; }

  /* ---- STRIKE surface tokens (dark default + light variant) ---- */
  .strike {
    --s-bg: #15171a;
    --s-header: #0f1113;
    --s-panel: #1b1d21;
    --s-card: #232629;
    --s-chip: #26292d;
    --s-line: rgba(255,255,255,0.09);
    --s-line-strong: rgba(255,255,255,0.18);
    --s-text: #fafafa;
    --s-muted: #9aa0a6;
    --s-faint: #6b7177;
    color: var(--s-text);
  }
  .strike.light {
    --s-bg: #e7e9ec;
    --s-header: #ffffff;
    --s-panel: #f5f6f7;
    --s-card: #ffffff;
    --s-chip: #eef0f2;
    --s-line: rgba(0,0,0,0.20);
    --s-line-strong: rgba(0,0,0,0.30);
    --s-text: #1a1c1e;
    --s-muted: #5f6368;
    --s-faint: #9aa0a6;
  }
  ::-webkit-scrollbar { width: 9px; height: 9px; }
  ::-webkit-scrollbar-thumb { background: rgba(140,145,150,0.35); border-radius: 9px; }
  ::-webkit-scrollbar-track { background: transparent; }
  .mapboxgl-ctrl-logo, .mapboxgl-ctrl-attrib { opacity: 0.35; }

  @keyframes s-popover-in {
    from { opacity: 0; transform: translateY(10px); }
    to   { opacity: 1; transform: translateY(0); }
  }
</style>
</head>
<body>
<template id="__bundler_thumbnail">
  <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
    <rect width="100" height="100" fill="#15171a"/>
    <circle cx="38" cy="42" r="4" fill="#62c23f"/>
    <circle cx="58" cy="34" r="4" fill="#3b9ae1"/>
    <circle cx="66" cy="58" r="4" fill="#ff8c42"/>
    <circle cx="44" cy="62" r="4" fill="#b9c0c7"/>
    <rect x="22" y="44" width="3" height="8" fill="#56BC2F"/>
  </svg>
</template>

<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<script src="https://api.mapbox.com/mapbox-gl-js/v3.9.0/mapbox-gl.js"></script>

<script src="strike-data.js"></script>
<script type="text/babel" src="strike-bundle.jsx"></script>
</body>
</html>
